<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16232A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilanz">
<title>Bilanz</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ground:#12161F; --surface:#1B212C; --surfaceHi:#252C3A; --line:#2C3441;
  --ink:#FFFFFF; --inkDim:#8A929E; --inkFaint:#5C6472;
  --accent:#4A9EFF;
  --kcal:#6DCB92; --protein:#F0A93B; --fat:#A78BDB; --carb:#4EC5B0;
  --steps:#4A9EFF; --alarm:#EF6B5E;
}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center}
.sub{font-size:12px;color:var(--inkFaint);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  margin-bottom:16px;flex-wrap:wrap;padding:0 16px}
.datepick{display:flex;align-items:center;gap:4px}
.datepick input{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-size:13px;padding:7px 9px;border-radius:8px}
.ghost{background:none;border:1px solid var(--line);color:var(--inkDim);width:32px;height:32px;
  border-radius:8px;font-size:18px;cursor:pointer;line-height:1}

/* Reiter oben, blaue Unterstreichung wie im Vorbild */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:0}
.tab{background:none;border:none;color:var(--inkDim);font-size:12px;font-weight:600;
  padding:12px 4px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-family:inherit}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.on svg.ic{color:var(--accent)}

/* Abschnitte: flach, durch Trennlinien getrennt */
.panel{background:var(--surface);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:18px 16px;margin-bottom:10px}
.panel.accent{border-left:3px solid var(--accent)}

/* Zusammenfassungszeilen: Label links, Wert rechts */
.kv{display:flex;align-items:center;justify-content:space-between;padding:13px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--ink)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.kv .v.blue{color:var(--accent)}
.kv .dot{width:11px;height:11px;border-radius:3px;margin-right:10px;flex:0 0 auto}
.kv .k-wrap{display:flex;align-items:center;flex:1;min-width:0}

/* Kopfzeile mit drei Kennzahlen */
.triple{display:flex;border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:0 16px 16px}
.triple>div{flex:1;padding-right:10px}
.triple>div+div{border-left:1px solid var(--line);padding-left:14px}
.triple .tv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.triple .tk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--inkDim);margin-top:3px}

/* Korridor */
.corridor{margin-bottom:20px;padding-left:12px;border-left:2px solid var(--line)}
.corridor:last-child{margin-bottom:0}
.corridor.warnline{border-left-color:var(--alarm)}
.corridor.okline{border-left-color:var(--kcal)}
.corridor-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.corridor-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--inkDim)}
.corridor-num{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.corridor-unit{font-size:12px;color:var(--inkFaint);font-weight:400}
.track{position:relative;height:10px;background:var(--surfaceHi);border-radius:5px}
.fill{height:100%;border-radius:5px;transition:width .35s ease}
.floor{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--alarm)}
.floor::before{content:'';position:absolute;top:-4px;left:-2px;width:6px;height:6px;border-radius:50%;background:var(--alarm)}
.tgt{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--inkFaint);opacity:.8}
.corridor-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px}

/* Eingaben */
.grid-in{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.wide{grid-column:1/-1}
.in{background:var(--ground);border:1px solid var(--line);color:var(--ink);padding:12px;
  border-radius:8px;font-size:16px;width:100%;font-family:inherit;font-variant-numeric:tabular-nums}
.in::placeholder{color:var(--inkFaint)}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.primary{background:var(--accent);color:#fff;border:none;padding:13px;border-radius:8px;
  font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary.alt{background:var(--surfaceHi);color:var(--ink)}
.primary:active{opacity:.85}
.danger{background:none;border:1px solid var(--alarm);color:var(--alarm);padding:12px;border-radius:8px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.row{display:flex;gap:8px;align-items:center}
.row .in{flex:1}.row .primary{flex:0 0 auto;padding:13px 18px}

ul{list-style:none}
li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.li-tap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;
  color:inherit;font:inherit;text-align:left;padding:4px 0;cursor:pointer}
.li-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-vals{font-size:11px;color:var(--inkDim);white-space:nowrap;font-variant-numeric:tabular-nums}
.li-on{background:var(--surfaceHi);border-radius:8px;padding-left:8px;padding-right:8px}
.del{width:34px;height:34px;flex:0 0 auto;background:none;border:1px solid var(--line);
  color:var(--inkDim);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.del:active{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.hint-tap{font-size:11px;color:var(--inkFaint);margin-bottom:2px}
.empty{color:var(--inkFaint);font-size:13px;text-align:center;padding:18px 0}
.note{color:var(--inkDim);font-size:12px;line-height:1.65;margin-top:12px}
.warn{color:var(--alarm);font-size:12px;line-height:1.65;margin-top:10px}

/* Segmentwahl */
.seg{display:flex;gap:0;background:var(--ground);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;flex-wrap:nowrap}
.seg-b{flex:1;background:none;border:none;color:var(--inkDim);padding:10px 4px;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-b+.seg-b{border-left:1px solid var(--line)}
.seg-b.on{background:var(--surfaceHi);color:var(--ink)}
.seg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px}

/* Balkendiagramm */
.chart{position:relative;height:190px;margin:0 0 6px;padding-left:38px}
.bars{display:flex;align-items:flex-end;gap:4px;height:100%}
.col{flex:1;height:100%;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:2px 2px 0 0;min-height:2px}
.cl-t,.cl-f{position:absolute;left:38px;right:0;height:1px;pointer-events:none}
.cl-t{background:var(--inkFaint);opacity:.5}
.cl-f{background:var(--alarm);opacity:.7}
.cl-t span,.cl-f span{position:absolute;right:0;top:-14px;font-size:9px;letter-spacing:.04em}
.cl-t span{color:var(--inkFaint)}.cl-f span{color:var(--alarm)}
.gridline{position:absolute;left:38px;right:0;height:1px;background:var(--line);pointer-events:none}
.gridlabel{position:absolute;left:0;width:34px;text-align:right;font-size:10px;
  color:var(--inkFaint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--inkFaint);
  margin:0 0 14px 38px;font-variant-numeric:tabular-nums}
.xlabels{display:flex;margin:4px 0 14px 38px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--inkFaint);line-height:1.35}

.qb{background:var(--ground);border:1px solid var(--line);color:var(--inkDim);padding:8px 11px;
  border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px}
.qb b{color:var(--ink);font-weight:600}
.qb-x{border-color:var(--alarm);color:var(--alarm)}.qb-x b{color:var(--alarm)}
.qb-mode{border-style:dashed}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.goalbar{height:8px;background:var(--ground);border-radius:4px;overflow:hidden;margin-bottom:8px}
.goalbar>div{height:100%;background:var(--kcal);transition:width .4s}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--inkFaint);margin-bottom:16px}
.field{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.field>span{flex:1 0 140px;font-size:14px;color:var(--ink)}
.field>span em{color:var(--inkFaint);font-style:normal;font-size:11px}
.field .in{flex:0 1 110px}.field .seg{flex:1 1 100%}
.field input[type=range]{flex:1;accent-color:var(--accent)}
.rv{font-size:14px;color:var(--accent);min-width:36px;font-variant-numeric:tabular-nums}
.pill{font-size:11px;letter-spacing:.06em}
.stepbig{font-size:42px;font-weight:600;line-height:1;margin-bottom:16px;color:var(--steps);
  font-variant-numeric:tabular-nums}
.stepbig span{font-size:13px;color:var(--inkFaint);font-weight:400}
.steps-list{margin:0 0 14px 18px;font-size:13px;line-height:1.9;color:var(--inkDim)}
.steps-list b{color:var(--ink);font-weight:600}
.urlbox{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:11px 12px;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);
  word-break:break-all;margin-bottom:10px;-webkit-user-select:all;user-select:all}
.ok{border-left:3px solid var(--kcal);color:var(--kcal);font-size:14px;text-align:center}
.drift{color:var(--alarm);font-size:12px;line-height:1.65;margin-top:12px}
.foot{text-align:center;font-size:11px;color:var(--inkFaint);margin-top:24px;line-height:1.7;padding:0 16px}

svg.ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.ic-lg{width:20px;height:20px}
svg.ic-xl{width:36px;height:36px;stroke-width:1.6}
.tab svg.ic{display:block;margin:0 auto 4px;width:20px;height:20px}
h2 svg.ic{margin-right:8px;color:var(--inkDim)}

/* Linien-Diagramm Gewicht */
.linechart{width:100%;height:200px;display:block}
.linechart .grid{stroke:var(--line);stroke-width:1}
.linechart .axislabel{fill:var(--inkFaint);font-size:10px}
.linechart .wline{fill:none;stroke:var(--kcal);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.linechart .warea{fill:var(--kcal);opacity:.09}
.linechart .wpt{fill:var(--kcal)}
.linechart .goalline{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}
.linechart .goaltext{fill:var(--accent);font-size:10px}

/* Overlay */
.veil{position:fixed;inset:0;background:rgba(8,11,17,.85);-webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 20px;
  max-width:400px;width:100%;text-align:center;animation:rise .26s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow-y:auto}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-mark{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;border:2px solid currentColor}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:8px}
.sheet p.lead{font-size:14px;line-height:1.65;color:var(--inkDim);margin-bottom:20px}
.sheet-rows{text-align:left;background:var(--ground);border-radius:10px;padding:4px 14px;margin-bottom:18px}
.srow{display:flex;align-items:center;gap:10px;font-size:13px;padding:11px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow .sk{flex:1;color:var(--inkDim)}
.srow .sv{font-weight:600;font-variant-numeric:tabular-nums}
.closebtn{width:100%;padding:13px;border-radius:8px;border:none;background:var(--surfaceHi);
  color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="head">
  <div><h1>Bilanz</h1><p class="sub">Ernährung · Schritte · Ziel</p></div>
  <div class="datepick">
    <button class="ghost" id="prev" aria-label="Vorheriger Tag">‹</button>
    <input type="date" id="date">
    <button class="ghost" id="next" aria-label="Nächster Tag">›</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-t="tag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h11"/></svg>Tag</button>
  <button class="tab" data-t="verlauf"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V10M9 20V4M15 20v-7M21 20v-11"/></svg>Verlauf</button>
  <button class="tab" data-t="ziel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>Ziel</button>
  <button class="tab" data-t="schritte"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4c1.6 0 2.4 1.3 2.4 3 0 2.2-.6 3.4-.6 5.2 0 1.4-.6 2.3-1.9 2.3s-2-.9-2-2.3c0-1.8-.5-3-.5-5.2C5.4 5.3 6.4 4 8 4Z"/><path d="M6 18.2c0 1.4.9 2 2 2s2-.6 2-2"/><path d="M16.5 8.5c1.5 0 2.3 1.2 2.3 2.8 0 2-.6 3.1-.6 4.8 0 1.3-.5 2.1-1.7 2.1s-1.9-.8-1.9-2.1c0-1.7-.5-2.8-.5-4.8 0-1.6.9-2.8 2.4-2.8Z"/></svg>Schritte</button>
</nav>

<div id="overlay"></div>

<main id="view"></main>

<footer class="foot">
  Daten liegen nur auf diesem Gerät. Kein Ersatz für ärztliche Beratung.
</footer>

<script>
"use strict";

/* ---------- Speicher ---------- */
const K_DAYS = "bilanz.days", K_PROF = "bilanz.profile", K_FAV = "bilanz.favs";
const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ alert("Speichern fehlgeschlagen. Ist der private Modus aktiv?"); } };

const DEFAULT_PROFILE = {
  sex:"m", age:30, height:181, weight:97, targetWeight:85,
  mode:"abnehmen", activity:1.2, proteinFloor:130, fatFloor:60, deficit:500
};
const DEFAULT_FAVS = [
  { name:"2 Eier hart", kcal:155, protein:13, fat:11 },
  { name:"Mozzarella 125 g", kcal:250, protein:19, fat:19 },
  { name:"Naturjoghurt 250 g", kcal:150, protein:9, fat:8 },
  { name:"Banane", kcal:95, protein:1, fat:0 },
  { name:"10 Walnüsse", kcal:190, protein:4, fat:19 }
];

let profile = Object.assign({}, DEFAULT_PROFILE, load(K_PROF, {}));
let days = load(K_DAYS, {});
let favs = load(K_FAV, DEFAULT_FAVS);
let tab = "tag", range = 7, metric = "kcal", date = isoToday();
let editId = null;   /* Eintrag, der gerade korrigiert wird */
let favEdit = false; /* Schnellauswahl im Bearbeiten-Modus */

function isoToday(d){ const x = d ? new Date(d) : new Date();
  x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
const deD = iso => { const p = iso.split("-"); return p[2]+"."+p[1]+"."; };
const blank = () => ({ entries:[], steps:0, weight:null });
const getDay = k => days[k] || blank();

/* ---------- Rechenkern (Quellen: Mifflin-St Jeor 1990, PAL nach FAO/WHO) ---------- */
const STEP_MIN = 500;      /* darunter wird nichts angerechnet */
const WALK_KMH = 3.5;      /* Durchschnittstempo 3-4 km/h */
const WALK_MET_NET = 2.0;  /* 3.0 MET Gehen minus 1.0 MET Ruhe, der steckt schon im Grundumsatz */

/* Schrittkalorien: Schrittlaenge aus Koerpergroesse, Strecke, Dauer, dann MET x kg x h */
function stepKcal(p, steps){
  const n = steps || 0;
  if (n < STEP_MIN) return 0;
  const strideM = 0.415 * p.height / 100;
  const km = n * strideM / 1000;
  const hours = km / WALK_KMH;
  return Math.round(WALK_MET_NET * p.weight * hours);
}
function stepKm(p, steps){ return ((steps||0) * (0.415 * p.height / 100)) / 1000; }

function bmr(p){ const b = 10*p.weight + 6.25*p.height - 5*p.age;
  return Math.round(p.sex === "m" ? b+5 : b-161); }
function tdee(p, steps){ return Math.round(bmr(p) * p.activity) + stepKcal(p, steps); }
function kcalTarget(p, steps){
  const burn = tdee(p, steps), floor = bmr(p);
  if (p.mode === "halten") return burn;
  if (p.mode === "zunehmen") return burn + 300;
  return Math.max(burn - Math.min(p.deficit, 600), floor);
}
function sums(d){ return (d.entries||[]).reduce((a,e)=>({
  kcal:a.kcal+(e.kcal||0), protein:a.protein+(e.protein||0), fat:a.fat+(e.fat||0)
}), {kcal:0,protein:0,fat:0}); }

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Symbole (Inline-SVG, keine Fremdquellen) ---------- */
const PATHS = {
  tag:      '<path d="M3 7h18M3 12h18M3 17h11"/>',
  verlauf:  '<path d="M3 20V10M9 20V4M15 20v-7M21 20v-11"/>',
  ziel:     '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 4V2M12 22v-2M4 12H2M22 12h-2"/>',
  schritte: '<path d="M8 4c1.6 0 2.4 1.3 2.4 3 0 2.2-.6 3.4-.6 5.2 0 1.4-.6 2.3-1.9 2.3s-2-.9-2-2.3c0-1.8-.5-3-.5-5.2C5.4 5.3 6.4 4 8 4Z"/><path d="M6 18.2c0 1.4.9 2 2 2s2-.6 2-2"/><path d="M16.5 8.5c1.5 0 2.3 1.2 2.3 2.8 0 2-.6 3.1-.6 4.8 0 1.3-.5 2.1-1.7 2.1s-1.9-.8-1.9-2.1c0-1.7-.5-2.8-.5-4.8 0-1.6.9-2.8 2.4-2.8Z"/>',
  plus:     '<path d="M12 5v14M5 12h14"/>',
  check:    '<path d="M4 12.5 9.5 18 20 6.5"/>',
  cross:    '<path d="M6 6l12 12M18 6 6 18"/>',
  pencil:   '<path d="M14.5 4.5 19.5 9.5M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20Z"/>',
  trash:    '<path d="M4 7h16M9 7V4.8h6V7M6.5 7l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/>',
  copy:     '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.2"/><path d="M15.5 5.2A2.2 2.2 0 0 0 13.4 3.5H6a2.2 2.2 0 0 0-2.2 2.2v7.4c0 1 .7 1.9 1.7 2.1"/>',
  save:     '<path d="M12 3v12m0 0 4.2-4.2M12 15l-4.2-4.2M4 17v2.2A1.8 1.8 0 0 0 5.8 21h12.4A1.8 1.8 0 0 0 20 19.2V17"/>',
  open:     '<path d="M12 21V9m0 0 4.2 4.2M12 9 7.8 13.2M4 6V3.8A1.8 1.8 0 0 1 5.8 2h12.4A1.8 1.8 0 0 1 20 3.8V6"/>',

const ic = (name, cls) => '<svg class="ic'+(cls?" "+cls:"")+'" viewBox="0 0 24 24" aria-hidden="true">'+(PATHS[name]||"")+'</svg>';

/* ---------- Korridor ---------- */
function corridor(label, value, floor, target, unit, colorVar, idle){
  const scaleMax = Math.max(target*1.25, value*1.1, floor*1.4, 1);
  const pct = n => Math.min(100, (n/scaleMax)*100);
  const below = !idle && floor > 0 && value < floor;
  let foot;
  if (idle) foot = '<span style="color:var(--inkFaint)">noch nichts erfasst</span>';
  else if (below) foot = '<span style="color:var(--alarm)">'+Math.round(floor-value)+' '+unit+' unter der Untergrenze</span>';
  else if (value > target*1.05) foot = '<span style="color:var(--inkDim)">'+Math.round(value-target)+' '+unit+' über dem Ziel</span>';
  else foot = '<span style="color:var(--inkFaint)">'+(value>=target ? 'Ziel erreicht' : 'noch '+Math.round(target-value)+' '+unit)+'</span>';
  const line = idle ? "" : below ? " warnline" : (value >= floor && value <= target*1.05 ? " okline" : "");
  return '<div class="corridor'+line+'"><div class="corridor-head">'
    + '<span class="corridor-label">'+label+'</span>'
    + '<span class="corridor-num" style="color:var(--'+colorVar+')">'+Math.round(value)
    + '<span class="corridor-unit"> / '+Math.round(target)+' '+unit+'</span></span></div>'
    + '<div class="track"><div class="fill" style="width:'+pct(value)+'%;background:var(--'+colorVar+')"></div>'
    + (floor>0 ? '<div class="floor" style="left:'+pct(floor)+'%"></div>' : '')
    + '<div class="tgt" style="left:'+pct(target)+'%"></div></div>'
    + '<div class="corridor-foot">'+foot+'</div></div>';
}

/* ---------- XY-Liniendiagramm Gewicht ---------- */
function weightChart(keys){
  const W = 340, H = 200, padL = 34, padR = 10, padT = 12, padB = 26;
  const pts = keys.map(k => ({ t: new Date(k).getTime(), w: days[k].weight, k:k }));
  const ws = pts.map(p => p.w).concat([profile.targetWeight]);
  let lo = Math.min.apply(null, ws), hi = Math.max.apply(null, ws);
  const span = Math.max(hi - lo, 2);
  lo = Math.floor(lo - span*0.12); hi = Math.ceil(hi + span*0.12);
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const tSpan = Math.max(t1 - t0, 86400000);

  const X = t => padL + (t - t0)/tSpan * (W - padL - padR);
  const Y = w => padT + (hi - w)/(hi - lo) * (H - padT - padB);

  /* Gitter mit runden kg-Schritten */
  const rows = 4, step = (hi - lo)/rows;
  let grid = "";
  for (let i = 0; i <= rows; i++){
    const val = lo + step*i, y = Y(val);
    grid += '<line class="grid" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>'
      + '<text class="axislabel" x="'+(padL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'
      + val.toFixed(val % 1 === 0 ? 0 : 1)+'</text>';
  }

  /* Zielgewicht als gestrichelte Linie */
  const gy = Y(profile.targetWeight);
  const goal = (profile.targetWeight >= lo && profile.targetWeight <= hi)
    ? '<line class="goalline" x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'"/>'
      + '<text class="goaltext" x="'+(W-padR)+'" y="'+(gy-5).toFixed(1)+'" text-anchor="end">Ziel '+profile.targetWeight+' kg</text>'
    : "";

  const line = pts.map((p,i) => (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.w).toFixed(1)).join(" ");
  const area = pts.length > 1
    ? line + " L"+X(pts[pts.length-1].t).toFixed(1)+" "+(H-padB)+" L"+X(pts[0].t).toFixed(1)+" "+(H-padB)+" Z"
    : "";
  const dots = pts.map(p => '<circle class="wpt" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="3"/>').join("");

  /* X-Beschriftung: erster, mittlerer, letzter Punkt */
  const idx = pts.length > 2 ? [0, Math.floor(pts.length/2), pts.length-1] : pts.map((_,i)=>i);
  const xlab = idx.map(i => '<text class="axislabel" x="'+X(pts[i].t).toFixed(1)+'" y="'+(H-8)
    + '" text-anchor="'+(i===0?"start":i===pts.length-1?"end":"middle")+'">'+deD(pts[i].k)+'</text>').join("");

  return '<svg class="linechart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" '
    + 'aria-label="Gewichtsverlauf">'+grid+goal
    + (area?'<path class="warea" d="'+area+'"/>':"")
    + '<path class="wline" d="'+line+'"/>'+dots+xlab+'</svg>';
}

function viewVerlauf(){
  const d = getDay(date), t = kcalTarget(profile, d.steps);
  const conf = {
    kcal:   { target:t, floor:bmr(profile), c:"kcal" },
    protein:{ target:Math.round(profile.proteinFloor*1.15), floor:profile.proteinFloor, c:"protein" },
    fat:    { target:Math.round(t*0.3/9), floor:profile.fatFloor, c:"fat" },
    steps:  { target:10000, floor:0, c:"steps" }
  }[metric];

  let h = '<div class="panel"><div class="seg-wrap"><div class="seg" id="seg-range">';
  [[7,"7 Tage"],[30,"30 Tage"],[90,"3 Monate"]].forEach(r=>{
    h += '<button class="seg-b'+(range===r[0]?" on":"")+'" data-r="'+r[0]+'">'+r[1]+'</button>'; });
  h += '</div></div><div class="seg-wrap" style="margin-bottom:16px"><div class="seg" id="seg-metric">';
  [["kcal","Kalorien"],["protein","Eiweiß"],["fat","Fett"],["steps","Schritte"]].forEach(m=>{
    h += '<button class="seg-b'+(metric===m[0]?" on":"")+'" data-m="'+m[0]+'">'+m[1]+'</button>'; });
  h += '</div></div>';

  const keys = Object.keys(days).sort().slice(-range);
  if (!keys.length) return h + '<p class="empty">Noch keine Tage erfasst.</p></div>';

  const vals = keys.map(k => metric==="steps" ? (days[k].steps||0) : (sums(days[k])[metric]||0));
  const max = Math.max.apply(null, vals.concat([conf.target*1.1, 1]));
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const half = Math.ceil(vals.length/2);
  const f = vals.slice(0,half), sec = vals.slice(half);
  const m1 = f.reduce((a,b)=>a+b,0)/(f.length||1);
  const m2 = sec.reduce((a,b)=>a+b,0)/(sec.length||1);
  const drift = Math.round(m2-m1);

  h += '<div class="chart">';
  if (conf.floor>0) h += '<div class="cl-f" style="bottom:'+(conf.floor/max*100)+'%"><span>Untergrenze '+Math.round(conf.floor)+'</span></div>';
  h += '<div class="cl-t" style="bottom:'+(conf.target/max*100)+'%"><span>Ziel '+Math.round(conf.target)+'</span></div>';
  h += '<div class="bars">';
  vals.forEach((v,i)=>{
    const col = (conf.floor>0 && v<conf.floor) ? "var(--alarm)" : "var(--"+conf.c+")";
    h += '<div class="col" title="'+deD(keys[i])+': '+Math.round(v)+'"><div class="bar" style="height:'
      + (v/max*100)+'%;background:'+col+'"></div></div>';
  });
  h += '</div></div><div class="axis"><span>'+deD(keys[0])+'</span><span>'+deD(keys[keys.length-1])+'</span></div>';

  const driftCol = Math.abs(drift) < max*0.05 ? "var(--inkDim)" : (drift<0 ? "var(--alarm)" : "var(--kcal)");
  const unit = metric === "steps" ? "" : metric === "kcal" ? " kcal" : " g";
  h += '<div class="kv"><span class="k-wrap"><span class="dot" style="background:var(--'+conf.c+')"></span>'
    + '<span class="k">Durchschnitt</span></span><span class="v">'+Math.round(avg)+unit+'</span></div>'
    + '<div class="kv"><span class="k">Ziel</span><span class="v blue">'+Math.round(conf.target)+unit+'</span></div>'
    + (conf.floor>0 ? '<div class="kv"><span class="k">Untergrenze</span><span class="v" style="color:var(--alarm)">'
        + Math.round(conf.floor)+unit+'</span></div>' : '')
    + '<div class="kv"><span class="k">Tage erfasst</span><span class="v">'+keys.length+'</span></div>'
    + '<div class="kv"><span class="k">Tendenz im Zeitraum</span><span class="v" style="color:'+driftCol+'">'
    + (drift>0?"+":"")+drift+unit+'</span></div>';
  if (drift < -max*0.1) h += '<p class="drift">Der Wert sinkt über den Zeitraum — zweite Hälfte im Schnitt '
    + Math.abs(drift) + ' niedriger als die erste.</p>';
  h += '</div>';

  /* --- Gewicht als XY-Diagramm --- */
  const wk = Object.keys(days).filter(k => days[k].weight).sort().slice(-range);
  h += '<div class="panel"><h2>'+ic("scale")+'Gewicht</h2>';
  if (wk.length < 2){
    h += '<p class="empty">Mindestens zwei Wiegungen nötig, damit eine Kurve entsteht. '
      + 'Trag dein Gewicht im Tag-Bereich ein.</p></div>';
  } else {
    const first = days[wk[0]].weight, last = days[wk[wk.length-1]].weight;
    const diff = last - first;
    const pctDiff = first ? (diff/first*100) : 0;
    const arrow = diff < 0 ? "↘" : diff > 0 ? "↗" : "→";
    const dCol = profile.mode === "abnehmen"
      ? (diff < 0 ? "var(--kcal)" : diff > 0 ? "var(--alarm)" : "var(--inkDim)")
      : "var(--inkDim)";
    h += '<div class="triple">'
      + '<div><div class="tv">'+first+' kg</div><div class="tk">Start</div></div>'
      + '<div><div class="tv">'+last+' kg</div><div class="tk">Aktuell</div></div>'
      + '<div><div class="tv" style="color:'+dCol+'">'+arrow+' '+Math.abs(diff).toFixed(1)+' kg</div>'
      + '<div class="tk">Unterschied ('+(pctDiff>0?"+":"")+pctDiff.toFixed(1)+'%)</div></div></div>'
      + weightChart(wk)
      + '<div class="kv"><span class="k">Zielgewicht</span><span class="v blue">'+profile.targetWeight+' kg</span></div>'
      + '<div class="kv"><span class="k">Noch zu gehen</span><span class="v">'
      + Math.abs(profile.targetWeight - last).toFixed(1)+' kg</span></div>'
      + '<div class="kv"><span class="k">Wiegungen im Zeitraum</span><span class="v">'+wk.length+'</span></div>'
      + '</div>';

    /* Einzelne Wiegungen, neueste zuerst */
    h += '<div class="panel"><h2>'+ic("tag")+'Einträge</h2>';
    wk.slice().reverse().forEach(k => {
      const dt = new Date(k);
      const wd = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][dt.getDay()];
      const mo = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][dt.getMonth()];
      h += '<div class="kv"><span class="k-wrap"><span class="k">'+days[k].weight+' kg<br>'
        + '<span style="color:var(--inkDim);font-size:12px">'+wd+', '+dt.getDate()+'. '+mo+' '+dt.getFullYear()+'</span>'
        + '</span></span></div>';
    });
    h += '</div>';
  }
  return h;
}

function viewZiel(){
  const wk = Object.keys(days).filter(k=>days[k].weight).sort();
  const first = wk.length ? days[wk[0]].weight : profile.weight;
  const last = wk.length ? days[wk[wk.length-1]].weight : profile.weight;
  const total = profile.targetWeight - first, done = last - first;
  const prog = total === 0 ? 100 : Math.max(0, Math.min(100, done/total*100));
  const rest = Math.abs(profile.targetWeight - last);
  const rate = profile.mode === "abnehmen" ? Math.min(profile.deficit,600)*7/7700 : 0;
  const weeks = rate > 0 ? Math.ceil(rest/rate) : null;

  let h = '<div class="panel accent"><h2>'+ic("ziel")+'Fortschritt</h2>'
    + '<div class="goalbar"><div style="width:'+prog+'%"></div></div>'
    + '<div class="ends"><span>'+first+' kg</span><span>'+profile.targetWeight+' kg</span></div>'
    + '<div class="kv"><span class="k">Aktuell</span><span class="v">'+last+' kg</span></div>'
    + '<div class="kv"><span class="k">Zielgewicht</span><span class="v blue">'+profile.targetWeight+' kg</span></div>'
    + '<div class="kv"><span class="k">Noch zu gehen</span><span class="v">'+rest.toFixed(1)+' kg</span></div>'
    + '<div class="kv"><span class="k">Rechnerisch erreicht in</span><span class="v">'+(weeks?weeks+" Wochen":"—")+'</span></div><p class="note">Die Wochenschätzung nutzt 7.700 kcal ≈ 1 kg Fett. Diese Regel ist zu optimistisch, '
    + 'weil der Verbrauch mit sinkendem Gewicht mitfällt — in der Praxis dauert es länger.</p></div>';

  h += '<div class="panel"><h2>'+ic("pencil")+'Einstellungen</h2>';
  h += '<label class="field"><span>Ziel</span><div class="seg" id="seg-mode">';
  ["abnehmen","halten","zunehmen"].forEach(m=>{
    h += '<button class="seg-b'+(profile.mode===m?" on":"")+'" data-mode="'+m+'">'+m[0].toUpperCase()+m.slice(1)+'</button>'; });
  h += '</div></label>';

  [["age","Alter","Jahre",1],["height","Größe","cm",1],["weight","Gewicht","kg",0.1],
   ["targetWeight","Zielgewicht","kg",0.1],["proteinFloor","Eiweiß-Untergrenze","g",1],
   ["fatFloor","Fett-Untergrenze","g",1]].forEach(f=>{
    h += '<label class="field"><span>'+f[1]+' <em>'+f[2]+'</em></span>'
      + '<input class="in" type="number" step="'+f[3]+'" inputmode="decimal" data-p="'+f[0]+'" value="'+profile[f[0]]+'"></label>';
  });

  h += '<label class="field"><span>Alltagsaktivität</span><select class="in" data-p="activity">';
  [[1.2,"Sitzend"],[1.4,"Leicht aktiv"],[1.55,"Mäßig aktiv"],[1.725,"Sehr aktiv"]].forEach(a=>{
    h += '<option value="'+a[0]+'"'+(profile.activity==a[0]?" selected":"")+'>'+a[1]+'</option>'; });
  h += '</select></label>'
    + '<p class="note">Wähle <b>Sitzend</b>, wenn du deine Schritte separat erfasst — sonst wird die '
    + 'Alltagsbewegung doppelt gezählt.</p>';

  if (profile.mode === "abnehmen")
    h += '<label class="field"><span>Defizit <em>kcal/Tag</em></span>'
      + '<input type="range" min="200" max="600" step="50" data-p="deficit" value="'+profile.deficit+'">'
      + '<b class="rv">'+profile.deficit+'</b></label>';

  h += '<p class="note">Grundlagen: Grundumsatz nach Mifflin-St Jeor (1990), Aktivitätsfaktoren nach FAO/WHO, '
    + 'Eiweiß 1,6 g/kg nach Morton et al. (2018). Das Tagesziel fällt nie unter deinen Grundumsatz ('
    + bmr(profile)+' kcal).</p></div>';

  h += '<div class="panel"><h2>'+ic("save")+'Daten</h2><div class="row">'
    + '<button class="primary alt" id="export">'+ic("save")+'Sichern (JSON)</button>'
    + '<button class="primary alt" id="import">'+ic("open")+'Einlesen</button></div>'
    + '<p class="note">Lege gelegentlich eine Sicherung ab. Löscht du die Website-Daten in Safari, '
    + 'sind die Einträge weg.</p></div>';
  return h;
}

    + '<div class="kv"><span class="k">Strecke</span><span class="v">'+stepKm(profile, d.steps).toFixed(2)+' km</span></div>'
    + '<div class="kv"><span class="k">Zusätzlich verbrannt</span><span class="v">'+stepKcal(profile, d.steps)+' kcal</span></div>'
    + '<div class="kv"><span class="k">Damit Tagesziel</span><span class="v blue">'+kcalTarget(profile, d.steps)+' kcal</span></div>'
    + '<p class="note">Gerechnet mit '+WALK_KMH+' km/h und einer Schrittlänge von '
    + (0.415*profile.height/100).toFixed(2)+' m (aus deiner Größe). Erst ab '+STEP_MIN
    + ' Schritten wird angerechnet — darunter ist es Alltagsbewegung, die schon im Aktivitätsfaktor steckt.</p></div>'
    + '<div class="panel"><h2>'+ic("health")+'Aus Apple Health</h2>'
    + '<p class="note" style="margin-top:0">Ein Browser darf Health nicht lesen — das erlaubt Apple nur '
    + 'nativen Apps. Ein Kurzbefehl darf es aber und kann den Wert hier abliefern. Einmal einrichten:</p>'
    + '<ol class="steps-list">'
    + '<li>Kurzbefehle-App → neuer Kurzbefehl</li>'
    + '<li>Aktion <b>Gesundheitsproben suchen</b>: Typ <b>Schritte</b>, Zeitraum <b>heute</b></li>'
    + '<li>Aktion <b>Statistik berechnen</b> → <b>Summe</b></li>'
    + '<li>Aktion <b>URL öffnen</b> mit dieser Adresse, das Ergebnis hinten einsetzen:</li>'
    + '</ol>'
    + '<div class="urlbox" id="urlbox">'+esc(base)+'?steps=</div>'
    + '<button class="primary alt" id="copy-url">'+ic("copy")+'Adresse kopieren</button>'
    + '<p class="note">Danach unter <b>Automation</b> einen persönlichen Ablauf anlegen, z. B. täglich '
    + '22:00 — dann trägt sich der Tageswert von selbst ein. Der Kurzbefehl überschreibt immer nur den '
    + 'jeweiligen Tag.</p></div>'
    + '<div class="panel"><h2>'+ic("sensor")+'Sensor im Browser</h2><div class="row">'
    + '<button class="primary'+(on?" alt":"")+'" id="motion">'+(on?"Zählen stoppen":"Zählen starten")+'</button>'
    + '<span class="pill" style="color:'+(on?"var(--kcal)":"var(--inkFaint)")+'">'+(on?"läuft":"gestoppt")+'</span></div>'
    + '<p class="warn'+(motionNote?"":" hide")+'" id="m-note">'+esc(motionNote)+'</p>'
    + '<p class="note">Notlösung ohne Kurzbefehl: zählt nur bei offener App und eingeschaltetem Bildschirm '
    + 'und ist deutlich ungenauer als Health. Der Kurzbefehl oben ist der bessere Weg.</p></div>'
    + '<div class="panel"><h2>'+ic("keypad")+'Von Hand</h2><div class="row">'
    + '<input class="in" id="s-in" type="number" inputmode="numeric" placeholder="Schritte gesamt">'
    + '<button class="primary" id="s-set">'+ic("check")+'Setzen</button></div>'
    + '<p class="note">Überschreibt den Tageswert.</p></div>';
}

/* ---------- Render + Events ---------- */
const view = document.getElementById("view");

/* ---------- Übergabe aus Apple Kurzbefehlen: ?steps=8432[&datum=2026-07-25] ---------- */
let handoff = "";
(function readParams(){
  try {
    const q = new URLSearchParams(location.search);
    const raw = q.get("steps");
    if (raw === null) return;
    const n = parseInt(raw, 10);
    if (isNaN(n) || n < 0 || n > 200000) return;
    let key = q.get("datum") || q.get("date") || isoToday();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) key = isoToday();
    const d = Object.assign({}, days[key] || blank());
    d.steps = n;
    days[key] = d;
    save(K_DAYS, days);
    date = key;
    tab = "schritte";
    handoff = n.toLocaleString("de-DE") + " Schritte aus Health übernommen (" + deD(key) + ")";
    /* URL säubern, damit ein Neuladen den Wert nicht erneut setzt */
    if (history.replaceState) history.replaceState(null, "", location.pathname);
  } catch(e){ /* Parameter ignorieren */ }
})();

function render(){
  document.getElementById("date").value = date;
  document.getElementById("date").max = isoToday();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), b =>
    b.classList.toggle("on", b.dataset.t === tab));
  view.innerHTML = tab==="tag" ? viewTag() : tab==="verlauf" ? viewVerlauf()
    : tab==="ziel" ? viewZiel() : viewSchritte();
  wire();
}

function mutate(fn){
  const d = Object.assign({}, getDay(date));
  d.entries = (d.entries||[]).slice();
  fn(d);
  days[date] = d;
  save(K_DAYS, days);
  render();
}

/* Eine Nachkommastelle, ohne unnoetige Null: 3.5 -> "3,5", 4.0 -> "4" */
const n1 = v => Math.round((Number(v)||0)*10)/10;
const fmt = v => n1(v).toLocaleString("de-DE", {maximumFractionDigits:1});

/* Prueft, ob kcal zu Eiweiss und Fett passen. Eiweiss 4 kcal/g, Fett 9 kcal/g.
   Kohlenhydrate sind unbekannt, deshalb ist nur die Untergrenze pruefbar. */
function implausible(v){
  const min = v.protein*4 + v.fat*9;
  if (min <= 0) return null;
  if (v.kcal >= min*0.95) return null;
  return "Die Zahlen passen nicht zusammen.\n\n"
    + fmt(v.protein) + " g Eiweiß und " + fmt(v.fat) + " g Fett ergeben allein schon "
    + Math.round(min) + " kcal, eingetragen sind " + v.kcal + " kcal.\n\n"
    + "Meist ist eine Menge pro Portion mit der Menge für mehrere Portionen vertauscht.\n\n"
    + "Trotzdem speichern?";
}

function addEntry(name, kcal, protein, fat){
  if (!kcal && !protein && !fat) return;
  mutate(d => d.entries.push({ id:Date.now()+Math.random(), name:name||"Eintrag",
    kcal:Math.round(kcal), protein:n1(protein), fat:n1(fat) }));
}

/* ---------- Tagesabschluss ---------- */
function closeDay(){
  const d = getDay(date), s = sums(d);
  const t = kcalTarget(profile, d.steps), floor = bmr(profile);
  const pFloor = profile.proteinFloor, fFloor = profile.fatFloor;

  const proteinOk = s.protein >= pFloor;
  const fatOk = s.fat >= fFloor;
  const kcalInCorridor = s.kcal >= floor && s.kcal <= t*1.05;
  const kcalOver = s.kcal > t*1.05;
  const nothing = d.entries.length === 0;

  let mark, color, title, lead;

  if (nothing){
    mark = "keypad"; color = "var(--inkDim)";
    title = "Noch nichts erfasst";
    lead = "Für diesen Tag sind keine Mahlzeiten eingetragen. Trag ein, was du gegessen hast — auch grob geschätzt ist besser als gar nicht.";
  } else if (kcalInCorridor && proteinOk && fatOk){
    mark = "check"; color = "var(--kcal)";
    title = "Tag im Korridor";
    lead = "Kalorien im Zielbereich, Eiweiß und Fett über der Untergrenze. Genau so sieht ein Tag aus, der dich zum Ziel bringt, ohne dass du Muskeln dafür bezahlst.";
  } else if (kcalOver){
    mark = "flag"; color = "var(--protein)";
    title = "Schade — morgen wird klappen";
    lead = "Heute über dem Tagesziel. Ein einzelner Tag ändert am Ergebnis fast nichts, entscheidend ist der Schnitt über die Woche. Schau im Verlauf nach, wie er steht.";
  } else if (s.kcal < floor){
    mark = "health"; color = "var(--alarm)";
    title = "Unter dem Grundumsatz";
    lead = "Heute " + Math.round(floor - s.kcal) + " kcal unter dem, was dein Körper in völliger Ruhe verbraucht. Das ist kein Erfolg, auch wenn die Waage kurzfristig darauf reagiert — bei so wenig holt sich der Körper Energie aus der Muskulatur.";
  } else {
    const missing = [];
    if (!proteinOk) missing.push(Math.round(pFloor - s.protein) + " g Eiweiß");
    if (!fatOk) missing.push(Math.round(fFloor - s.fat) + " g Fett");
    mark = "flag"; color = "var(--protein)";
    title = "Fast im Korridor";
    lead = "Die Kalorien passen, aber es fehlen " + missing.join(" und ") + " zur Untergrenze. Ein Nachschlag mit Quark, Ei oder Käse würde den Tag rundmachen.";
  }

  /* --- Vergleich mit dem letzten davorliegenden Tag, an dem etwas erfasst wurde --- */
  let compare = "";
  const prevKey = Object.keys(days).filter(k => k < date && (days[k].entries||[]).length > 0).sort().pop();
  if (prevKey && !nothing){
    const ps = sums(days[prevKey]);
    const dK = Math.round(s.kcal - ps.kcal);
    const dP = Math.round(s.protein - ps.protein);
    const sign = n => (n > 0 ? "+" : "") + n;
    const col = n => n > 0 ? "var(--kcal)" : n < 0 ? "var(--alarm)" : "var(--inkDim)";
    compare = '<div class="sheet-rows" style="margin-top:-6px">'
      + '<div class="srow"><span class="sk">gegenüber '+deD(prevKey)+'</span></div>'
      + '<div class="srow"><span class="sk">Kalorien</span><span class="sv" style="color:'+col(dK)+'">'
        + sign(dK)+' kcal</span></div>'
      + '<div class="srow"><span class="sk">Eiweiß</span><span class="sv" style="color:'+col(dP)+'">'
        + sign(dP)+' g</span></div>'
      + '</div>';
  }

  const row = (k, v, ok) =>
    '<div class="srow"><span style="color:'+(ok?"var(--kcal)":"var(--inkFaint)")+'">'
    + ic(ok?"check":"cross")+'</span><span class="sk">'+k+'</span><span class="sv">'+v+'</span></div>';

  document.getElementById("overlay").innerHTML =
    '<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true">'
    + '<div class="sheet-mark" style="color:'+color+'">'+ic(mark,"ic-xl")+'</div>'
    + '<h3>'+title+'</h3><p class="lead">'+lead+'</p>'
    + '<div class="sheet-rows">'
    + row("Kalorien", Math.round(s.kcal)+" / "+t, kcalInCorridor)
    + row("Eiweiß", Math.round(s.protein)+" / "+pFloor+" g", proteinOk)
    + row("Fett", Math.round(s.fat)+" / "+fFloor+" g", fatOk)
    + row("Schritte", (d.steps||0)+" / 10.000", (d.steps||0) >= 10000)
    + '</div>' + compare + '<button class="closebtn" id="veil-close">Schließen</button></div></div>';

  const shut = () => { document.getElementById("overlay").innerHTML = ""; };
  document.getElementById("veil-close").onclick = shut;
  document.getElementById("veil").onclick = e => { if (e.target.id === "veil") shut(); };
}

function wire(){
  const $ = id => document.getElementById(id);

  if (tab === "tag"){
    if ($("close-day")) $("close-day").onclick = closeDay;
    const vals = () => ({
      name: $("f-name").value.trim(),
      kcal: +$("f-kcal").value || 0,
      protein: parseFloat(String($("f-prot").value).replace(",", ".")) || 0,
      fat: parseFloat(String($("f-fat").value).replace(",", ".")) || 0
    });

    if ($("add")){
      $("add").onclick = () => {
        const v = vals();
        const msg = implausible(v);
        if (msg && !confirm(msg)) return;
        addEntry(v.name, v.kcal, v.protein, v.fat);
      };
      $("f-fat").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
      $("fav-add").onclick = () => {
        const v = vals();
        if (!v.name){ alert("Gib der Schnellauswahl erst einen Namen."); return; }
        if (!v.kcal && !v.protein && !v.fat){ alert("Trag erst Werte ein."); return; }
        favs.push(v); save(K_FAV, favs); render();
      };
      $("fav-mode").onclick = () => { favEdit = !favEdit; render(); };
      Array.prototype.forEach.call(document.querySelectorAll("[data-fav]"), b =>
        b.onclick = () => {
          const i = +b.dataset.fav;
          if (favEdit){ favs.splice(i,1); save(K_FAV, favs); render(); return; }
          const f = favs[i]; addEntry(f.name, f.kcal, f.protein, f.fat);
        });
    }

    if ($("save-edit")){
      $("save-edit").onclick = () => {
        const v = vals();
        if (!v.kcal && !v.protein && !v.fat){ alert("Mindestens ein Wert muss gefüllt sein."); return; }
        const msg = implausible(v);
        if (msg && !confirm(msg)) return;
        mutate(d => {
          d.entries = d.entries.map(e => String(e.id) === String(editId)
            ? { id:e.id, name:v.name || "Eintrag", kcal:Math.round(v.kcal),
                protein:n1(v.protein), fat:n1(v.fat) }
            : e);
        });
        editId = null; render();
      };
      $("f-fat").onkeydown = e => { if (e.key === "Enter") $("save-edit").click(); };
      $("cancel-edit").onclick = () => { editId = null; render(); };
      $("del-edit").onclick = () => {
        const id = editId; editId = null;
        mutate(d => { d.entries = d.entries.filter(e => String(e.id) !== String(id)); });
      };
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"), b =>
      b.onclick = () => {
        editId = String(b.dataset.edit) === String(editId) ? null : b.dataset.edit;
        favEdit = false; render();
        const n = $("f-kcal"); if (n && editId) n.focus();
      });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), b =>
      b.onclick = ev => {
        ev.stopPropagation();
        if (String(b.dataset.del) === String(editId)) editId = null;
        mutate(d => { d.entries = d.entries.filter(e => String(e.id) !== b.dataset.del); });
      });
    $("w-save").onclick = () => {
      const w = parseFloat($("w-in").value);
      if (!w || w < 30 || w > 300) return;
      mutate(d => d.weight = w);
      profile.weight = w; save(K_PROF, profile);
    };
    $("w-in").onkeydown = e => { if (e.key === "Enter") $("w-save").click(); };
  }

  if (tab === "verlauf"){
    Array.prototype.forEach.call(document.querySelectorAll("[data-r]"), b =>
      b.onclick = () => { range = +b.dataset.r; render(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), b =>
      b.onclick = () => { metric = b.dataset.m; render(); });
  }

  if (tab === "ziel"){
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), b =>
      b.onclick = () => { profile.mode = b.dataset.mode; save(K_PROF, profile); render(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), el => {
      const ev = el.type === "range" ? "input" : "change";
      el.addEventListener(ev, () => {
        profile[el.dataset.p] = parseFloat(el.value) || 0;
        save(K_PROF, profile);
        if (el.type === "range"){ const rv = el.parentNode.querySelector(".rv"); if (rv) rv.textContent = el.value; }
        else render();
      });
    });
    $("export").onclick = () => {
      const blob = new Blob([JSON.stringify({ profile, days, favs }, null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bilanz-" + isoToday() + ".json";
      a.click();
    };
    $("import").onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = () => {
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const o = JSON.parse(fr.result);
            if (o.days) { days = o.days; save(K_DAYS, days); }
            if (o.profile) { profile = Object.assign({}, DEFAULT_PROFILE, o.profile); save(K_PROF, profile); }
            if (o.favs) { favs = o.favs; save(K_FAV, favs); }
            render();
          } catch(e){ alert("Datei konnte nicht gelesen werden."); }
        };
        fr.readAsText(inp.files[0]);
      };
      inp.click();
    };
  }

  if (tab === "schritte"){
    $("motion").onclick = () => motionOn ? stopMotion() : startMotion();
    $("s-set").onclick = () => { const v = parseInt($("s-in").value); if (!isNaN(v)) mutate(d => d.steps = Math.max(0,v)); };
    $("s-in").onkeydown = e => { if (e.key === "Enter") $("s-set").click(); };
    $("copy-url").onclick = () => {
      const txt = $("urlbox").textContent;
      const done = () => { $("copy-url").textContent = "Kopiert"; setTimeout(() => {
        if ($("copy-url")) $("copy-url").textContent = "Adresse kopieren"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(done).catch(() => alert(txt));
      else alert(txt);
    };
    handoff = "";
  }
}

document.getElementById("tabs").onclick = e => {
  if (e.target.dataset.t){ tab = e.target.dataset.t; render(); }
};
document.getElementById("date").onchange = e => { date = e.target.value; render(); };
document.getElementById("prev").onclick = () => {
  const d = new Date(date); d.setDate(d.getDate()-1); date = isoToday(d); render(); };
document.getElementById("next").onclick = () => {
  const d = new Date(date); d.setDate(d.getDate()+1);
  const k = isoToday(d); if (k <= isoToday()){ date = k; render(); } };

/* ---------- Schrittsensor ---------- */
let motionOn = false, motionNote = "";
const sen = { ema:9.8, last:0, armed:true, pending:0 };

function onMotion(ev){
  const a = ev.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  sen.ema = sen.ema*0.85 + mag*0.15;
  const dev = mag - sen.ema, now = Date.now();
  if (sen.armed && dev > 1.6 && now - sen.last > 300){
    sen.armed = false; sen.last = now; sen.pending++;
  }
  if (dev < 0.4) sen.armed = true;
}

/* Schritte gebündelt schreiben, damit nicht bei jedem Schritt gerendert wird */
setInterval(() => {
  if (!sen.pending) return;
  const n = sen.pending; sen.pending = 0;
  const d = Object.assign({}, getDay(date));
  d.steps = (d.steps||0) + n;
  days[date] = d;
  save(K_DAYS, days);
  if (tab === "schritte") render();
}, 1000);

function startMotion(){
  const go = () => {
    window.addEventListener("devicemotion", onMotion);
    motionOn = true; motionNote = ""; render();
  };
  if (typeof DeviceMotionEvent === "undefined"){
    motionNote = "Dieses Gerät stellt keinen Bewegungssensor bereit. Trag die Schritte von Hand ein.";
    render(); return;
  }
  if (typeof DeviceMotionEvent.requestPermission === "function"){
    DeviceMotionEvent.requestPermission().then(res => {
      if (res === "granted") go();
      else {
        motionNote = "Zugriff abgelehnt. In iOS unter Einstellungen › Safari › Bewegung & Ausrichtung freigeben, dann neu laden.";
        render();
      }
    }).catch(err => { motionNote = "Sensor nicht verfügbar: " + err.message; render(); });
  } else if (!window.isSecureContext){
    motionNote = "Der Bewegungssensor braucht HTTPS. Über http:// oder als lokale Datei bleibt er gesperrt.";
    render();
  } else go();
}
function stopMotion(){ window.removeEventListener("devicemotion", onMotion); motionOn = false; render(); }

render();
</script>
